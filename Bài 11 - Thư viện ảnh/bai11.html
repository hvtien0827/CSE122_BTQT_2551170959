<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="gallery">
        <header class="header">
            <h2>Thư viện ảnh Việt Nam</h2>
            <p>Bộ sưu tập 6 danh thắng tiêu biểu - minh hoa thẻ figure / figcaption.</p>
        </header>
        <div class="pictures">
            <figure class="picture">
                <img src="1-vinh-ha-long.jpg" alt="1-vinh-ha-long">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>
            <figure class="picture">
                <img src="2-son-doong.jpg" alt="sơn doong">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>
            <figure class="picture">
                <img src="3-thac-ban-gioc.jpg" alt="thác">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>
            <figure class="picture">
                <img src="4-fansipan.jpg" alt="fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>
            <figure class="picture">
                <img src="5-mekong.jpg" alt="mekong">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>
            <figure class="picture">
                <img src="6-phong-nha.jpg" alt="động">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </div>
    </main>
</body>

</html>
