<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 26 - Form đăng ký với Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container py-5">
    <section class="card shadow mx-auto registration">
      <header class="card-header bg-success text-white text-center py-3">
        <h1 class="h4 mb-0">Đăng ký tham gia CLB Lập trình Web</h1>
      </header>
      <form class="card-body">
        <div class="row g-3">
          <div class="col-md-6"><label for="fullname" class="form-label">Họ và tên</label><input id="fullname"
              type="text" class="form-control" required></div>
          <div class="col-md-6"><label for="student-id" class="form-label">Mã sinh viên</label><input id="student-id"
              type="text" class="form-control" required></div>
          <div class="col-md-6"><label for="email" class="form-label">Email</label><input id="email" type="email"
              class="form-control" required></div>
          <div class="col-md-6"><label for="phone" class="form-label">Số điện thoại</label><input id="phone" type="tel"
              class="form-control" required></div>
          <fieldset class="col-12">
            <legend class="fs-6">Trình độ</legend>
            <div class="form-check form-check-inline"><input id="basic" class="form-check-input" type="radio"
                name="level" value="Cơ bản" checked><label class="form-check-label" for="basic">Cơ bản</label></div>
            <div class="form-check form-check-inline"><input id="good" class="form-check-input" type="radio"
                name="level" value="Khá"><label class="form-check-label" for="good">Khá</label></div>
            <div class="form-check form-check-inline"><input id="advanced" class="form-check-input" type="radio"
                name="level" value="Tốt"><label class="form-check-label" for="advanced">Tốt</label></div>
          </fieldset>
          <div class="col-12"><label for="class-name" class="form-label">Chọn lớp</label><select class="form-select"
              id="class-name" required>
              <option value="">-- Chọn lớp --</option>
              <option>67KTPM1</option>
              <option>67KTPM2</option>
              <option>67CNTT1</option>
            </select></div>
          <div class="col-12">
            <div class="form-check"><input class="form-check-input" id="commit" type="checkbox" required><label
                class="form-check-label" for="commit">Tôi cam kết tự làm bài và quay video OBS.</label>
            </div>
          </div>
          <div class="col-6 d-grid"><button type="reset" class="btn btn-outline-secondary">Nhập lại</button></div>
          <div class="col-6 d-grid"><button type="submit" class="btn btn-success">Đăng ký</button></div>
        </div>
      </form>
    </section>
  </main>
</body>

</html>
