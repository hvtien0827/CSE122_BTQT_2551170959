<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 30 - Bảng điều khiển</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="dashboard">
            <aside class="sidebar bg-dark text-white">
                <p class="brand fw-bold">CSE.TLU Admin</p>
                <nav class="nav nav-pills flex-column p-2" aria-label="Menu bảng điều khiển">
                    <a href="#overview" class="nav-link active">Bảng điều khiển</a>
                    <a href="#chapters" class="nav-link">Bài tập</a>
                    <a href="#statistics" class="nav-link">Sinh viên</a>
                    <a href="#average" class="nav-link">Điểm số</a>
                </nav>
            </aside>
            <main class="p-4" id="overview">
                <header class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">Bảng điều khiển</h1>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-warning text-dark">3 bài mới</span>
                        <button type="button" class="btn btn-primary btn-sm">Xuất báo cáo</button>
                    </div>
                </header>
                <section id="statistics" class="row g-3" aria-label="Thống kê">
                    <div class="col-md-3">
                        <article class="card shadow-sm border-0 h-100">
                            <div class="card-body">
                                <h2 class="stat-label">Sinh viên</h2>
                                <p class="fs-2 fw-bold mb-2">128</p>
                                <div
                                    class="progress"
                                    role="progressbar"
                                    aria-label="Sinh viên"
                                    aria-valuenow="80"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div class="progress-bar bg-primary progress-80"></div>
                                </div>
                            </div>
                        </article>
                    </div>
                    <div class="col-md-3">
                        <article class="card shadow-sm border-0 h-100">
                            <div class="card-body">
                                <h2 class="stat-label">Đã nộp</h2>
                                <p class="fs-2 fw-bold mb-2">96</p>
                                <div
                                    class="progress"
                                    role="progressbar"
                                    aria-label="Đã nộp"
                                    aria-valuenow="75"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div class="progress-bar bg-success progress-75"></div>
                                </div>
                            </div>
                        </article>
                    </div>
                    <div class="col-md-3">
                        <article class="card shadow-sm border-0 h-100">
                            <div class="card-body">
                                <h2 class="stat-label">Chưa nộp</h2>
                                <p class="fs-2 fw-bold mb-2">32</p>
                                <div
                                    class="progress"
                                    role="progressbar"
                                    aria-label="Chưa nộp"
                                    aria-valuenow="25"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div class="progress-bar bg-danger progress-25"></div>
                                </div>
                            </div>
                        </article>
                    </div>
                    <div class="col-md-3" id="average">
                        <article class="card shadow-sm border-0 h-100">
                            <div class="card-body">
                                <h2 class="stat-label">Điểm TB</h2>
                                <p class="fs-2 fw-bold mb-2">7.8</p>
                                <div
                                    class="progress"
                                    role="progressbar"
                                    aria-label="Điểm TB"
                                    aria-valuenow="78"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div class="progress-bar bg-warning progress-78"></div>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>
                <section id="chapters" class="card shadow-sm border-0 mt-4">
                    <div class="card-header bg-white">
                        <h2 class="h6 fw-bold my-1">Tiến độ theo chương</h2>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li
                            class="list-group-item d-flex justify-content-between align-items-center"
                        >
                            <span>Chương 1 — HTML5</span>
                            <span class="badge bg-success">100%</span>
                        </li>
                        <li
                            class="list-group-item d-flex justify-content-between align-items-center"
                        >
                            <span>Chương 2 — JavaScript</span>
                            <span class="badge bg-info text-dark">82%</span>
                        </li>
                        <li
                            class="list-group-item d-flex justify-content-between align-items-center"
                        >
                            <span>Chương 3 — CSS3</span>
                            <span class="badge bg-info text-dark">74%</span>
                        </li>
                        <li
                            class="list-group-item d-flex justify-content-between align-items-center"
                        >
                            <span>Chương 4 — Bootstrap 5</span>
                            <span class="badge bg-secondary">45%</span>
                        </li>
                    </ul>
                </section>
            </main>
        </div>
    </body>
</html>
